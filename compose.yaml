services:
  php:
    # noinspection ComposeUnknownValues
    image: ghcr.io/phpyh/php:${PHP_IMAGE_VERSION:?Make sure `PHP_IMAGE_VERSION` is declared in `.env`}
    user: ${CONTAINER_USER:-}
    environment:
      INSIDE_DEVCONTAINER: true
      HISTFILE: /workspace/var/.docker_history
      COMPOSER_CACHE_DIR: /workspace/var/.composer_cache
    tty: true
    volumes:
      - .:/workspace:cached
    working_dir: /workspace

  # The php service without Xdebug and with the extension of google/protobuf: see benchmarks/Comparison/README.md.
  comparison:
    extends: php
    image: thesis-protobuf-comparison:${PHP_IMAGE_VERSION}-${GOOGLE_PROTOBUF_VERSION:-none}
    build:
      context: benchmarks/Comparison
      args:
        PHP_IMAGE_VERSION: ${PHP_IMAGE_VERSION}
        GOOGLE_PROTOBUF_VERSION: ${GOOGLE_PROTOBUF_VERSION:-}
    profiles: [comparison]
