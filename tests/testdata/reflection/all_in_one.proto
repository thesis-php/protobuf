syntax = "proto3";

package test.v1;

message MegaTest {
  int32 a_int32 = 1;
  int64 a_int64 = 2;
  uint32 a_uint32 = 3;
  uint64 a_uint64 = 4;
  sint32 a_sint32 = 5;
  sint64 a_sint64 = 6;
  fixed32 a_fixed32 = 7;
  fixed64 a_fixed64 = 8;
  sfixed32 a_sfixed32 = 9;
  sfixed64 a_sfixed64 = 10;
  float a_float = 11;
  double a_double = 12;
  bool a_bool = 13;
  string a_string = 14;
  bytes a_bytes = 15;

  repeated int32 r_int32 = 16;
  repeated string r_strings = 18;
  repeated bytes r_bytes = 19;

  Nested nested = 20;

  repeated Nested nested_list = 21;

  map<string, int32> map_str_int32 = 22;
  map<int32, string> map_int32_str = 23;
  map<uint64, bool> map_uint64_bool = 24;

  map<string, Nested> map_str_msg = 25;
  map<int32, Nested> map_int32_msg = 26;

  DeepNested deep = 27;
}

message Nested {
  uint32 id = 1;
  string name = 2;
  repeated int64 values = 3;
}

message DeepNested {
  string title = 1;
  Inner inner = 2;

  message Inner {
    int32 x = 1;
    int32 y = 2;
    repeated Level lvl = 3;

    message Level {
      string label = 1;
      repeated Nested items = 2;
    }
  }
}
