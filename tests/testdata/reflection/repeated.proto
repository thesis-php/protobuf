syntax = "proto3";

package test.v1;

enum Direction {
  DIRECTION_NONE = 0;
  DIRECTION_UP = 1;
  DIRECTION_DOWN = -1;
}

message RepeatedItem {
  string name = 1;
}

message Repeated {
  repeated int32 p_int32 = 1;
  repeated int64 p_int64 = 2;
  repeated uint32 p_uint32 = 3;
  repeated uint64 p_uint64 = 4;
  repeated sint32 p_sint32 = 5;
  repeated sint64 p_sint64 = 6;
  repeated fixed32 p_fixed32 = 7;
  repeated fixed64 p_fixed64 = 8;
  repeated sfixed32 p_sfixed32 = 9;
  repeated sfixed64 p_sfixed64 = 10;
  repeated float p_float = 11;
  repeated double p_double = 12;
  repeated bool p_bool = 13;
  repeated Direction p_direction = 14;

  repeated int32 u_int32 = 21 [packed = false];
  repeated int64 u_int64 = 22 [packed = false];
  repeated uint32 u_uint32 = 23 [packed = false];
  repeated uint64 u_uint64 = 24 [packed = false];
  repeated sint32 u_sint32 = 25 [packed = false];
  repeated sint64 u_sint64 = 26 [packed = false];
  repeated fixed32 u_fixed32 = 27 [packed = false];
  repeated fixed64 u_fixed64 = 28 [packed = false];
  repeated sfixed32 u_sfixed32 = 29 [packed = false];
  repeated sfixed64 u_sfixed64 = 30 [packed = false];
  repeated float u_float = 31 [packed = false];
  repeated double u_double = 32 [packed = false];
  repeated bool u_bool = 33 [packed = false];
  repeated Direction u_direction = 34 [packed = false];

  repeated string strings = 40;
  repeated bytes blobs = 41;
  repeated RepeatedItem items = 42;
}
