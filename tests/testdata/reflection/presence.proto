syntax = "proto3";

package test.v1;

enum Sign {
  SIGN_ZERO = 0;
  SIGN_NEGATIVE = -1;
  SIGN_POSITIVE = 1;
  SIGN_MIN = -2147483648;
  SIGN_MAX = 2147483647;
}

message Point {
  int32 x = 1;
  int32 y = 2;
}

message Presence {
  int32 i_int32 = 1;
  uint64 i_uint64 = 2;
  float i_float = 3;
  double i_double = 4;
  bool i_bool = 5;
  string i_string = 6;
  bytes i_bytes = 7;
  Sign i_sign = 8;

  optional int32 o_int32 = 11;
  optional int64 o_int64 = 12;
  optional uint32 o_uint32 = 13;
  optional uint64 o_uint64 = 14;
  optional sint32 o_sint32 = 15;
  optional sint64 o_sint64 = 16;
  optional fixed32 o_fixed32 = 17;
  optional fixed64 o_fixed64 = 18;
  optional sfixed32 o_sfixed32 = 19;
  optional sfixed64 o_sfixed64 = 20;
  optional float o_float = 21;
  optional double o_double = 22;
  optional bool o_bool = 23;
  optional string o_string = 24;
  optional bytes o_bytes = 25;
  optional Sign o_sign = 26;

  Point point = 27;
}
