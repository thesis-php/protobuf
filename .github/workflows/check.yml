name: Check

on:
  workflow_dispatch: ~
  push:
    branches: [main, '*.*.x']
  pull_request: ~

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make fixer-check rector-check

  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make composer-validate composer-normalize-check deps-analyze

  phpstan:
    runs-on: ubuntu-latest
    strategy: &strategy
      fail-fast: false
      matrix:
        php: [ 8.4, 8.5 ]
        deps: [ lowest, highest ]
    steps:
      - uses: actions/checkout@v6
      - run: PHP_IMAGE_VERSION=${{ matrix.php }} make install-${{ matrix.deps }} phpstan

  test:
    runs-on: ubuntu-latest
    strategy: *strategy
    steps:
      - uses: actions/checkout@v6
      - run: PHP_IMAGE_VERSION=${{ matrix.php }} make install-${{ matrix.deps }} test

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # conformance_test_runner is not built here: it is taken from the image built by `make conformance-runner-image`
      # for the protobuf release pinned in tests/tools/protobuf.sh. See tests/conformance/README.md.
      - run: PHP_IMAGE_VERSION=8.4 make install-highest conformance-runner-pull conformance

  comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The times of a shared runner are noisy: what the job checks is that the comparison with google/protobuf runs,
      # and the table it leaves in the summary is to be read by how the libraries relate. See benchmarks/Comparison/README.md.
      - run: PHP_IMAGE_VERSION=8.4 make install-highest bench-compare
      - run: cat var/comparison/report.md >> "$GITHUB_STEP_SUMMARY"

  infection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: PHP_IMAGE_VERSION=8.4 make install-highest infect ARGS='--threads=max'
